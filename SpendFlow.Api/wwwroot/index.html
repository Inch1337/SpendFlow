<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpendFlow — учёт расходов</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>SpendFlow</h1>
            <p>Учёт личных расходов</p>
        </header>

        <p id="error-message" class="error-message" role="alert" hidden></p>
        <p id="status-message" role="status" hidden></p>

        <section aria-labelledby="add-expense-heading">
            <h2 id="add-expense-heading">Добавить расход</h2>
            <form id="expense-form">
                <div class="form-field">
                    <label for="description">Описание</label>
                    <input id="description" name="description" type="text" maxlength="500" required>
                </div>

                <div class="form-field">
                    <label for="amount">Сумма</label>
                    <input id="amount" name="amount" type="number" min="0" step="any" required>
                </div>

                <div class="form-field">
                    <label for="date">Дата</label>
                    <input id="date" name="date" type="date" required>
                </div>

                <div class="form-field">
                    <label for="category">Категория</label>
                    <select id="category" name="category" required>
                        <option value="">Выберите категорию</option>
                        <option value="Food">Еда</option>
                        <option value="Transport">Транспорт</option>
                        <option value="Housing">Жильё</option>
                        <option value="Entertainment">Развлечения</option>
                        <option value="Health">Здоровье</option>
                        <option value="Other">Другое</option>
                    </select>
                </div>

                <button id="add-expense-button" type="submit" disabled>Добавить</button>
            </form>
        </section>

        <section aria-labelledby="expenses-heading">
            <h2 id="expenses-heading">Расходы</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Дата</th>
                            <th scope="col">Описание</th>
                            <th scope="col">Категория</th>
                            <th scope="col" class="amount">Сумма</th>
                            <th scope="col">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-list">
                        <tr>
                            <td colspan="5" class="empty-message">Данные ещё не загружены</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
